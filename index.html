<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Procesos de Selección
  </title>

  <link
    rel="stylesheet"
    href="css/styles.css"
  >

</head>


<body>


<header>

  <div class="container">

    <h1>
      Procesos de Selección
    </h1>

    <p>
      Gestión de procesos y candidaturas
    </p>

  </div>

</header>


<nav>

  <div class="container nav">

    <button
      data-view="dashboard"
      class="active"
    >
      Dashboard
    </button>

    <button
      data-view="procesos"
    >
      Procesos
    </button>

    <button
      data-view="candidaturas"
    >
      Candidaturas
    </button>

    <button
      data-view="estados"
    >
      Estados
    </button>

    <button
      data-view="entrevistas"
    >
      Entrevistas
    </button>

    <button
      data-view="contrataciones"
    >
      Contrataciones
    </button>

  </div>

</nav>


<main class="container">


<!-- ============================= -->
<!-- DASHBOARD -->
<!-- ============================= -->

<section
  id="dashboard"
  class="view"
>

  <h2>
    Dashboard
  </h2>


  <div class="form-group">

    <label>
      Proceso
    </label>

    <select id="filtroProceso">

      <option value="">
        Todos los procesos
      </option>

    </select>

  </div>


  <div
    id="metricas"
    class="metrics"
  ></div>


  <div class="panel">

    <h3>
      Indicadores por sexo
    </h3>

    <div id="tablaSexo"></div>

  </div>


</section>



<!-- ============================= -->
<!-- PROCESOS -->
<!-- ============================= -->

<section
  id="procesos"
  class="view hidden"
>

  <h2>
    Nuevo proceso de selección
  </h2>


  <form id="formProceso">


    <label>
      Nombre del proceso

      <input
        name="Nombre_Proceso"
        required
      >

    </label>


    <label>
      Número de vacantes

      <input
        name="N_Vacantes"
        type="number"
        min="1"
        required
      >

    </label>


    <label>
      Descripción

      <textarea
        name="Descripcion"
      ></textarea>

    </label>


    <label>
      Fecha de inicio

      <input
        name="Fecha_Inicio"
        type="date"
      >

    </label>


    <label>
      Fecha de fin

      <input
        name="Fecha_Fin"
        type="date"
      >

    </label>


    <label>
      Fase inicial

      <select
        name="Fase_Actual"
        id="faseInicial"
      ></select>

    </label>


    <label>
      Observaciones

      <textarea
        name="Observaciones"
      ></textarea>

    </label>


    <button
      type="submit"
      class="primary"
    >
      Crear proceso
    </button>


    <div
      id="mensajeProceso"
      class="message"
    ></div>


  </form>

</section>



<!-- ============================= -->
<!-- CANDIDATURAS -->
<!-- ============================= -->

<section
  id="candidaturas"
  class="view hidden"
>

  <h2>
    Nueva candidatura
  </h2>


  <form id="formCandidatura">


    <label>
      Proceso

      <select
        name="ID_Proceso"
        id="candidaturaProceso"
        required
      ></select>

    </label>


    <label>
      Sexo

      <select
        name="Sexo"
        id="candidaturaSexo"
        required
      ></select>

    </label>


    <label>
      Fuente

      <select
        name="Fuente"
        id="candidaturaFuente"
        required
      ></select>

    </label>


    <label>
      Fecha de candidatura

      <input
        type="date"
        name="Fecha_Candidatura"
      >

    </label>


    <label>
      Observaciones

      <textarea
        name="Observaciones"
      ></textarea>

    </label>


    <button
      type="submit"
      class="primary"
    >
      Crear candidatura
    </button>


    <div
      id="mensajeCandidatura"
      class="message"
    ></div>


  </form>

</section>



<!-- ============================= -->
<!-- ESTADOS -->
<!-- ============================= -->

<section
  id="estados"
  class="view hidden"
>

  <h2>
    Actualizar estado de candidatura
  </h2>


  <form id="formEstado">


    <label>
      Candidatura

      <select
        name="ID_Candidatura"
        id="estadoCandidatura"
        required
      ></select>

    </label>


    <label>
      Nuevo estado

      <select
        name="Estado"
        id="nuevoEstado"
        required
      ></select>

    </label>


    <label>
      Observaciones

      <textarea
        name="Observaciones"
      ></textarea>

    </label>


    <button
      type="submit"
      class="primary"
    >
      Actualizar estado
    </button>


    <div
      id="mensajeEstado"
      class="message"
    ></div>


  </form>

</section>



<!-- ============================= -->
<!-- ENTREVISTAS -->
<!-- ============================= -->

<section
  id="entrevistas"
  class="view hidden"
>

  <h2>
    Registrar entrevista
  </h2>


  <form id="formEntrevista">


    <label>
      Candidatura

      <select
        name="ID_Candidatura"
        id="entrevistaCandidatura"
        required
      ></select>

    </label>


    <label>
      Fecha programada

      <input
        name="Fecha_Programada"
        type="datetime-local"
      >

    </label>


    <label>
      Fecha realizada

      <input
        name="Fecha_Realizacion"
        type="datetime-local"
      >

    </label>


    <label>
      Estado

      <select
        name="Estado_Entrevista"
        id="estadoEntrevista"
      ></select>

    </label>


    <label>
      Resultado

      <select
        name="Resultado"
        id="resultadoEntrevista"
      ></select>

    </label>


    <label>
      Observaciones

      <textarea
        name="Observaciones"
      ></textarea>

    </label>


    <button
      type="submit"
      class="primary"
    >
      Registrar entrevista
    </button>


    <div
      id="mensajeEntrevista"
      class="message"
    ></div>


  </form>

</section>



<!-- ============================= -->
<!-- CONTRATACIONES -->
<!-- ============================= -->

<section
  id="contrataciones"
  class="view hidden"
>

  <h2>
    Registrar contratación
  </h2>


  <form id="formContratacion">


    <label>
      Candidatura

      <select
        name="ID_Candidatura"
        id="contratacionCandidatura"
        required
      ></select>

    </label>


    <label>
      Fecha de contrato

      <input
        name="Fecha_Contrato"
        type="date"
      >

    </label>


    <label>
      Estado

      <select
        name="Estado_Contrato"
        id="estadoContrato"
      ></select>

    </label>


    <label>
      Observaciones

      <textarea
        name="Observaciones"
      ></textarea>

    </label>


    <button
      type="submit"
      class="primary"
    >
      Registrar contratación
    </button>


    <div
      id="mensajeContratacion"
      class="message"
    ></div>


  </form>

</section>


</main>


<script src="js/app.js"></script>


</body>

</html>
